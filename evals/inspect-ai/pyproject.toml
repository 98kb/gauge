[project]
name = "skill-evals"
version = "0.1.0"
description = "Inspect AI evaluation harness for the agent skills in this repository."
requires-python = ">=3.11"
# Exact versions are pinned in uv.lock, committed beside this file. The repo
# already vendors its skills against a committed skills-lock.json; a Python
# harness that floated its dependencies would be the odd one out.
dependencies = [
  "inspect-ai>=0.3.263,<0.4",
  # Imported directly by shared/skills.py to parse SKILL.md frontmatter.
  # inspect-ai happens to pull it in, but depending on a transitive dependency
  # is how an import breaks on an unrelated upgrade.
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not docker'"
markers = [
  "docker: needs a working Docker daemon; runs a whole sample through the sandbox",
]

[tool.mypy]
python_version = "3.12"
packages = ["skill_evals"]
strict = true
# inspect_ai ships partial stubs for some submodules; don't fail on those.
ignore_missing_imports = true
disallow_untyped_decorators = false
